<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SSG - Gestión de Clientes{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
       body {
            margin: 0;
            min-height: 100vh;
            background-image: url('{{ url_for("static", filename="imagenes/fondo.png") }}');
            background-size: cover;
            background-position: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #000;
       }

        /* ==== SIDEBAR ==== */
        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100vh;
            background-color: #152471;
            color: #fdfdfd;
            padding-top: 1rem;
            transition: left 0.3s ease;
            z-index: 1000;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
        }

        .sidebar a {
            display: block;
            padding: 0.8rem 1rem;
            color: rgb(255, 255, 255);
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #5c5555;
        }

        /* ==== CONTENIDO PRINCIPAL ==== */
        .content {
            transition: margin-left 0.3s ease;
            padding: 1.5rem;
            color: #ffffff;
            text-decoration: none;
        }

        .content.shift {
            margin-left: 250px;
        }

        /* ==== NAVBAR SUPERIOR ==== */
        .navbar {
            color: #ffffff;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        .menu-toggle {
            font-size: 1.5rem;
            background: none;
            border: none;
            color: #152471;
            cursor: pointer;
        }

        .menu-toggle:hover {
            color: rgb(18, 71, 215);
        }

        /* === cambio === */
        .alerta {
            margin: 10px auto;
            max-width: 600px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Menú lateral -->
    <div class="sidebar" id="sidebar">
        <h2>Menú</h2>
        <a href="{{ url_for('inicio') }}">🏠 Inicio</a>
        <a href="{{ url_for('nuevo_cliente') }}">➕ Nuevo Cliente</a>
        <a href="{{ url_for('listado') }}">📋 Listado de Clientes</a>
        <a href="{{ url_for('estadisticas') }}">📈 estadistica</a>
    </div>

    <!-- Contenido -->
    <div class="content" id="content">
        <div class="navbar">
            <button class="menu-toggle" id="menu-toggle">&#9776;</button>
            <span><strong>Gym work</strong></span>
        </div>

        <!-- === cambio === -->
        <!-- Mostrar mensajes flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alerta alert alert-{{ category }} text-center">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <!-- === fin del cambio === -->

        <div class="mt-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        const menuToggle = document.getElementById("menu-toggle");
        const sidebar = document.getElementById("sidebar");
        const content = document.getElementById("content");

        menuToggle.addEventListener("click", () => {
            sidebar.classList.toggle("active");
            content.classList.toggle("shift");
        });
    </script>
</body>
</html>
